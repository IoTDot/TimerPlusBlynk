[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit BusIO@^1.14.1
    blynkkk/Blynk@^1.3.2
    thomasfredericks/Bounce2@^2.72
monitor_speed = 115200
upload_speed = 921600
;build_flags = -O0
build_flags = -O3

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit BusIO@^1.14.1
    blynkkk/Blynk@^1.3.2
    thomasfredericks/Bounce2@^2.72
monitor_speed = 115200
upload_speed = 921600
;build_flags = -O0
build_flags = -O3